<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼영보영 주간 소식지 (20260909_1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js 라이브러리 (PDF -> 이미지 자동 변환) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 헤더 영역 -->
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-slate-900">삼영보영 주간 소식지</h1>
                    <!-- 요청하신 YYYYMMDD_1 규격 적용 -->
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">20260909_1</span>
                </div>
                <p class="text-slate-500 text-sm mt-1">항목을 클릭하시면 고화질 소식지 원본을 열람하실 수 있습니다.</p>
            </div>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                <span>+ 새 소식지 작성</span>
            </button>
        </header>

        <!-- 소식지 목록 영역 -->
        <div id="newsletterList" class="space-y-3">
            <div class="text-center py-12 text-slate-400">소식지를 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 작성 모달 -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-900">새 소식지 등록</h2>
                <span class="text-xs text-slate-400">System 20260909_1</span>
            </div>
            
            <form id="uploadForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">발행일자 (수동 지정)</label>
                    <input type="date" id="newsDate" required class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">소식지 제목</label>
                    <input type="text" id="newsTitle" placeholder="예: 9월 2주차 주간 소식지" required class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">소식지 파일 (PDF 또는 이미지)</label>
                    <input type="file" id="newsFile" accept="image/*,application/pdf" multiple required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                    <p class="text-xs text-slate-400 mt-1">* PDF 파일은 자동으로 PNG 이미지로 변환되어 저장됩니다.</p>
                </div>

                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg transition-colors">취소</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-emerald-600 text-white font-medium text-sm rounded-lg hover:bg-emerald-700 transition-colors">소식지 등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Google Apps Script Web App URL 입력
        const API_URL = "YOUR_GAS_WEB_APP_URL"; 

        function openModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
            document.getElementById('newsDate').value = new Date().toISOString().substring(0, 10);
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadForm').reset();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const date = document.getElementById('newsDate').value;
            const title = document.getElementById('newsTitle').value;
            const fileInput = document.getElementById('newsFile');

            if (fileInput.files.length === 0) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "파일 변환 처리 중...";

            try {
                let processedFiles = [];

                for (const file of fileInput.files) {
                    if (file.type === 'application/pdf') {
                        // PDF -> PNG 자동 변환
                        const pdfImages = await convertPdfToImages(file, date, title);
                        processedFiles.push(...pdfImages);
                    } else if (file.type.startsWith('image/')) {
                        // 일반 이미지 읽기
                        const base64Data = await readImageAsBase64(file);
                        const ext = file.name.split('.').pop();
                        const formattedName = `${date}_${title}_${processedFiles.length + 1}.${ext}`;

                        processedFiles.push({
                            name: formattedName,
                            mimeType: file.type,
                            data: base64Data
                        });
                    }
                }

                submitBtn.innerText = "업로드 중...";

                const payload = {
                    date: date,
                    title: title,
                    files: processedFiles
                };

                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                alert("소식지가 성공적으로 등록되었습니다!");
                closeModal();
                location.reload();

            } catch (error) {
                console.error("등록 실패:", error);
                alert("등록 중 오류가 발생했습니다.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "소식지 등록하기";
            }
        }

        async function convertPdfToImages(file, date, title) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const images = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const base64Data = canvas.toDataURL('image/png').split(',')[1];
                const fileName = `${date}_${title}_page${i}.png`;

                images.push({
                    name: fileName,
                    mimeType: 'image/png',
                    data: base64Data
                });
            }
            return images;
        }

        function readImageAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
