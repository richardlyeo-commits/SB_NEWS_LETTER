<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼영보영 주간 소식지 (20260909_8)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-slate-900">삼영보영 주간 소식지</h1>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">20260909_8</span>
                </div>
                <p class="text-slate-500 text-sm mt-1">항목을 클릭하시면 소식지 원본을 열람하실 수 있습니다.</p>
            </div>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition-colors">
                <span>+ 작성 안내</span>
            </button>
        </header>

        <div id="newsletterList" class="space-y-3">
            <div class="text-center py-12 text-slate-400">소식지를 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 작성 안내 모달 -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-xl font-bold text-slate-900 mb-4">소식지 등록 안내</h2>
            <div class="space-y-2 text-sm text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100">
                <p>1. GitHub 저장소에 소식지 PDF 또는 이미지 파일을 업로드합니다.</p>
                <p>2. <code class="bg-slate-200 text-rose-600 px-1 py-0.5 rounded">newsletters.json</code> 파일에 신규 정보를 추가합니다.</p>
            </div>
            <div class="flex justify-end pt-4">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">닫기</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', loadNewsletters);

        async function loadNewsletters() {
            const listContainer = document.getElementById('newsletterList');

            try {
                // 캐시 방지를 위해 타임스탬프 쿼리 추가
                const response = await fetch(`./newsletters.json?t=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error(`파일을 찾을 수 없습니다 (상태 코드: ${response.status})`);
                }

                const textData = await response.text();
                let data = [];

                try {
                    data = JSON.parse(textData);
                } catch (jsonErr) {
                    throw new Error("newsletters.json 파일의 문법(JSON 형식)에 오류가 있습니다.");
                }

                if (!Array.isArray(data) || data.length === 0) {
                    listContainer.innerHTML = `<div class="text-center py-12 text-slate-400">등록된 소식지가 없습니다.</div>`;
                    return;
                }

                // 날짜 기준 내림차순 정렬 (최신순)
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                listContainer.innerHTML = data.map((item, index) => `
                    <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between hover:border-emerald-200 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md">${item.date}</span>
                            ${index === 0 ? '<span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">NEW</span>' : ''}
                            <h2 class="font-medium text-slate-800">${item.title}</h2>
                        </div>
                        <a href="${item.url}" target="_blank" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-600 text-slate-600 text-sm px-3 py-1.5 rounded-lg transition-colors font-medium flex items-center gap-1">
                            🔍 보기
                        </a>
                    </div>
                `).join('');

            } catch (error) {
                console.error("목록 불러오기 오류:", error);
                listContainer.innerHTML = `
                    <div class="bg-rose-50 border border-rose-100 p-6 rounded-2xl text-center">
                        <p class="text-rose-600 font-bold mb-1">⚠️ 데이터 불러오기 실패</p>
                        <p class="text-rose-500 text-sm">${error.message}</p>
                        <p class="text-slate-400 text-xs mt-2">newsletters.json 파일의 따옴표(" ")나 쉼표(,) 오타를 확인해 주세요.</p>
                    </div>`;
            }
        }

        function openModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        }
    </script>
</body>
</html>
