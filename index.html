<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼영보영 주간 소식지 (20260909_7)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 헤더 영역 -->
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-slate-900">삼영보영 주간 소식지</h1>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">20260909_7</span>
                </div>
                <p class="text-slate-500 text-sm mt-1">항목을 클릭하시면 소식지 원본을 열람하실 수 있습니다.</p>
            </div>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                <span>+ 새 소식지 작성</span>
            </button>
        </header>

        <!-- 소식지 목록 영역 -->
        <div id="newsletterList" class="space-y-3">
            <div class="text-center py-12 text-slate-400">소식지를 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 작성 모달 -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-900">새 소식지 등록 안내</h2>
                <span class="text-xs text-slate-400">System 20260909_7</span>
            </div>
            
            <div class="space-y-4 text-sm text-slate-600">
                <p>현재 GitHub Pages 정적 사이트 방식으로 운영되고 있습니다.</p>
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1">
                    <p class="font-bold text-slate-800">📌 소식지 추가 방법:</p>
                    <p>1. 파일(PDF/이미지)을 GitHub 저장소 내 폴더에 Commit/Push 합니다.</p>
                    <p>2. 저장소 루트의 <code class="bg-slate-200 px-1 py-0.5 rounded">newsletters.json</code> 파일에 신규 소식지 정보를 작성 후 저장합니다.</p>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-4">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-medium text-sm rounded-lg hover:bg-slate-200 transition-colors">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 newsletters.json 불러오기
        window.addEventListener('DOMContentLoaded', loadNewsletters);

        async function loadNewsletters() {
            const listContainer = document.getElementById('newsletterList');

            try {
                // 저장소 내 newsletters.json 파일 읽기 (캐시 방지 파라미터 추가)
                const response = await fetch(`./newsletters.json?t=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error("newsletters.json 파일을 찾을 수 없습니다.");
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    listContainer.innerHTML = `<div class="text-center py-12 text-slate-400">등록된 소식지가 없습니다.</div>`;
                    return;
                }

                // 날짜 기준 내림차순 정렬 (최신순)
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                listContainer.innerHTML = data.map((item, index) => `
                    <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex items-center justify-between hover:border-emerald-200 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md">${item.date}</span>
                            ${index === 0 ? '<span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">NEW</span>' : ''}
                            <h2 class="font-medium text-slate-800">${item.title}</h2>
                        </div>
                        <a href="${item.url}" target="_blank" class="bg-slate-100 hover:bg-emerald-50 hover:text-emerald-600 text-slate-600 text-sm px-3 py-1.5 rounded-lg transition-colors font-medium flex items-center gap-1">
                            🔍 보기
                        </a>
                    </div>
                `).join('');

            } catch (error) {
                console.error("목록 불러오기 오류:", error);
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-rose-500 font-medium">
                        소식지 목록(<code class="bg-rose-50 px-1 py-0.5 rounded">newsletters.json</code>)을 불러오지 못했습니다.
                    </div>`;
            }
        }

        function openModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        }
    </script>
</body>
</html>
